name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bulletproof Project Build
        run: |
          echo "Scanning workspace for Android project files..."
          
          # Find directory containing build.gradle.kts or build.gradle
          TARGET_DIR=""
          for dir in . */; do
            if [ -f "${dir}build.gradle.kts" ] || [ -f "${dir}build.gradle" ] || [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
              if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
                TARGET_DIR="."
              else
                TARGET_DIR="${dir%/}"
              fi
              break
            fi
          done
          
          # Fallback if target is still empty
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="."
          fi
          
          echo "Moving to project directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Check for gradlew or generate wrapper
          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          
          chmod +x gradlew
          echo "Executing APK build..."
          ./gradlew assembleRelease --no-daemon

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/outputs/apk/release/*.apk'
